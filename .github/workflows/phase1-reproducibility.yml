name: Phase 1 Reproducibility

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  baseline:
    name: Baseline (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    env:
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12.10"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install the pinned Phase 1 environment
        run: |
          python -m pip install -r requirements.txt
          python -m pip install --no-deps -e .
      - name: Run offline tests against committed inputs
        run: python -m pytest
      - name: Regenerate numeric results and report offline
        run: |
          python -m brd4_analysis.cli analyse
          python -m brd4_analysis.cli report
      - name: Require unchanged input, numeric-result and report bytes
        # The run timestamp/platform are deliberately not reproducible outputs.
        run: git diff --exit-code -- data docs/REPORT.md results/summary.json results/tables
